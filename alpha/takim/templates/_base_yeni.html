<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alpha Takim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    {% block style %}
            
    {% endblock style %}
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
   <div class="navbar bg-base-300">

</div>
  <header class="bg-gradient-to-r bg-slate-100 to-gray-300 shadow fixed top-0 w-full z-20">
    <div class="max-w-7xl mx-auto px-2 py-2 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <button id="sidebarToggle" class="lg:hidden text-gray-500 focus:outline-none">
          <!-- Menu icon -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <img class=" h-12 w-10 rounded-full"  src="/media/logo.jpeg" alt="">
        <span class="font-bold text-xl text-gray-800">Alpha Academy Yönetim</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-gray-600">Kullanıcı</span>
        
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar"
         class="fixed top-16 left-0 w-64 bg-slate-100 h-full border-r border-slate-200 shadow transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out z-10">
    <nav class="p-4">

               <ul class="list-reset flex flex-col">
                        <a href="{% url 'takim' %}"
                            class="font-sans font-hairline rounded hover:bg-gray-200 focus:bg-gray-200  text-sm text-nav-item no-underline">
                            <li class=" w-full h-full py-3 px-2  ">

                                <img class="h-8" src="https://img.icons8.com/?size=100&id=83326&format=png&color=000000"
                                    alt="">
                                Anasayfa


                            </li>
                        </a>
                        <a href="{% url 'takim_list' %}"
                            class="font-sans font-hairline rounded hover:bg-gray-200 focus:bg-gray-200   text-sm text-nav-item no-underline">
                            <li class="w-full h-full py-3 px-2 ">

                                <img class="h-8"
                                    src="https://img.icons8.com/?size=100&id=108335&format=png&color=000000" alt="">
                                Takımlar


                            </li>
                        </a>
                        <a href="{% url 'sporcular' %}"
                            class="font-sans font-hairline rounded hover:bg-gray-200 focus:bg-gray-200   text-sm text-nav-item no-underline">
                            <li class="w-full h-full py-3 px-2 ">

                                <img class="h-8"
                                    src="https://img.icons8.com/?size=100&id=cfNKLQSzR0jy&format=png&color=000000"
                                    alt="">
                                Sporcular


                            </li>
                        </a>
                        {% now "n" as current_year %}
                        <a href="{% url "odeme_list"  current_year   %}"
                            class="font-sans font-hairline rounded hover:bg-gray-200 focus:bg-gray-200  text-sm text-nav-item no-underline">
                            <li class="w-full h-full py-3 px-2 ">

                              <img class="size-8"
            src="https://img.icons8.com/?size=100&id=WSjGB0O5Cs0c&format=png&color=000000" alt="">
                                Ödemeler 


                            </li>
                        </a>
                    </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="md:m-4 lg:pl-64 p-2 md:p-6">
    {% block content %}
    {% endblock content %}

    
    <footer class="relative mt-24 bg-nav pt-8 pb-6">

        <div class="container mx-auto px-4">
            <div class="flex flex-wrap">

                <div class="w-full lg:w-6/12 px-4">
                    <div class="flex flex-wrap items-top ">

                    </div>
                </div>
            </div>
            <hr class="my-2 border-gray-400" />
            <div class="flex flex-wrap items-center md:justify-between justify-center">
                <div class="w-full md:w-4/12 px-4  text-center">
                    <div class="text-sm text-gray-600 font-semibold">
                        <p class="d-block">Copyright © Fk Alpha Academy | All rights reserved.</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
  </main>

  <!-- Sidebar Toggle Script -->
  <script>
    const toggleButton = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');

    toggleButton.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
    });
  </script>

</body>
</html>
